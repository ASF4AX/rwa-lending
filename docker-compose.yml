services:
  anvil:
    image: ghcr.io/foundry-rs/foundry:latest
    command: ["anvil", "-p", "8545", "-m", "${ANVIL_MNEMONIC}"]
    ports:
      - "8545:8545"

  oracle:
    build: ./oracle-go
    working_dir: /app
    environment:
      - PRIVATE_KEY=${PRIVATE_KEY}
      - RPC_URL=${RPC_URL}
      - FEED_ADDRESS=${FEED_ADDRESS}
      - CHAIN_ID=${CHAIN_ID}
      - HEARTBEAT=${HEARTBEAT}
      - DEVIATION=${DEVIATION}
    ports:
      - "8088:8080"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    working_dir: /usr/src/app
    environment:
      - VITE_RPC_URL=${RPC_URL}
    ports:
      - "5173:5173"
    volumes:
      - ./app:/usr/src/app
      - app_node_modules:/usr/src/app/node_modules

volumes:
  app_node_modules:
