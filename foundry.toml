[profile.default]
src = "contracts"
test = "test"
script = "script"
out = "out"
libs = ["dependencies"]
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "none"
ffi = false
gas_reports = ["*"]
remappings = [
    "@openzeppelin/=dependencies/@openzeppelin-contracts-5.4.0/",
    "forge-std/=dependencies/forge-std-1.11.0/src/",
]

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "short"
multiline_func_header = "all"

[soldeer]
remappings_location = "config"
remappings_version = false

[dependencies]
forge-std = "1.11.0"
"@openzeppelin-contracts" = "5.4.0"
